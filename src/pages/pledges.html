title: Our pledges | Ravi Janatha Party
desc: Draft 100-day pledges from Ravi Janatha Party, and how RJP differs from old politics.
titlekey: doc.title.pledges
---
<section class="page-hero">
  <video class="bg-video" autoplay muted loop playsinline preload="metadata" poster="assets/video/flag-poster.jpg" aria-hidden="true" tabindex="-1"><source src="assets/video/flag-loop.mp4" type="video/mp4"></video>
  <svg class="chakra" viewBox="-100 -100 200 200" aria-hidden="true">
      <circle class="disc" r="92"/>
      <circle r="92" fill="none" stroke="currentColor" stroke-width="3.2"/>
      <circle r="14" fill="none" stroke="currentColor" stroke-width="3.2"/>
      <g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" id="spokes"></g>
    </svg>
  <div class="wrap">
    <p class="crumbs"><a href="./" data-i18n="nav.home">Home</a><span aria-hidden="true">/</span><span data-i18n="pledge.eyebrow"></span></p>
    <h1 class="display" data-rich data-i18n="pledge.title"></h1>
    <p class="lead" data-i18n="pledges.lead"></p>
  </div>
</section>

<section class="band green">
  <div class="wrap">
    <ol class="pledges">
      <li class="reveal"><span data-i18n="pl1"></span></li>
      <li class="reveal"><span data-i18n="pl2"></span></li>
      <li class="reveal"><span data-i18n="pl3"></span></li>
      <li class="reveal"><span data-i18n="pl4"></span></li>
    </ol>
    <p class="fine" data-i18n="pledge.note"></p>
  </div>
</section>

<section class="band white">
  <div class="wrap two-col">
    <div class="reveal">
      <div class="label"><span class="line"></span><span data-i18n="pledges.hold.eyebrow"></span></div>
      <h2 class="display" data-rich data-i18n="pledges.hold.title"></h2>
    </div>
    <div class="prose reveal"><p data-i18n="pledges.hold.text"></p></div>
  </div>
</section>

<section class="band mint1" id="compare">
  <div class="wrap">
    <div class="reveal">
      <div class="label"><span class="line"></span><span data-i18n="cmp.eyebrow">RJP vs old politics</span></div>
      <h2 class="display" data-rich data-i18n="cmp.title"></h2>
    </div>
    <div class="cmp">
      <div class="cmp-h"><span class="x" data-i18n="cmp.old">Old politics</span><span class="v" data-i18n="cmp.new">RJP</span></div>
      <div class="cmp-r reveal"><p class="x"><i>✕</i><span data-i18n="cmp.o1"></span></p><p class="v"><i>✓</i><span data-i18n="cmp.n1"></span></p></div>
      <div class="cmp-r reveal"><p class="x"><i>✕</i><span data-i18n="cmp.o2"></span></p><p class="v"><i>✓</i><span data-i18n="cmp.n2"></span></p></div>
      <div class="cmp-r reveal"><p class="x"><i>✕</i><span data-i18n="cmp.o3"></span></p><p class="v"><i>✓</i><span data-i18n="cmp.n3"></span></p></div>
      <div class="cmp-r reveal"><p class="x"><i>✕</i><span data-i18n="cmp.o4"></span></p><p class="v"><i>✓</i><span data-i18n="cmp.n4"></span></p></div>
      <div class="cmp-r reveal"><p class="x"><i>✕</i><span data-i18n="cmp.o5"></span></p><p class="v"><i>✓</i><span data-i18n="cmp.n5"></span></p></div>
    </div>
  </div>
</section>

<section class="band green cta-band">
  <div class="wrap center reveal">
    <h2 class="display" data-rich data-i18n="join.title"></h2>
    <p class="lead" data-i18n="join.lead"></p>
    <a class="btn white" href="join"><span data-i18n="hero.cta1">Join the movement</span><i>→</i></a>
  </div>
</section>
